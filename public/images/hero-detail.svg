<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-label="Structural steel connection detail">
  <rect width="520" height="420" fill="#F7F7F5"/>
  <!-- column -->
  <rect x="210" y="40" width="100" height="340" fill="none" stroke="#191919" stroke-width="2.5"/>
  <rect x="222" y="40" width="76" height="340" fill="none" stroke="#404040" stroke-width="1"/>
  <!-- beam left -->
  <path d="M40 170 H210" stroke="#191919" stroke-width="2.5" fill="none"/>
  <path d="M40 155 H210 M40 185 H210" stroke="#404040" stroke-width="1.5" fill="none"/>
  <path d="M40 155 V185 M210 155 V185" stroke="#191919" stroke-width="2" fill="none"/>
  <!-- beam right -->
  <path d="M310 170 H480" stroke="#191919" stroke-width="2.5" fill="none"/>
  <path d="M310 155 H480 M310 185 H480" stroke="#404040" stroke-width="1.5" fill="none"/>
  <path d="M310 155 V185 M480 155 V185" stroke="#191919" stroke-width="2" fill="none"/>
  <!-- connection plate -->
  <rect x="198" y="145" width="124" height="60" fill="#F7F7F5" stroke="#191919" stroke-width="1.75"/>
  <!-- bolts -->
  <circle cx="230" cy="160" r="5" fill="none" stroke="#191919" stroke-width="1.5"/>
  <circle cx="260" cy="160" r="5" fill="none" stroke="#191919" stroke-width="1.5"/>
  <circle cx="290" cy="160" r="5" fill="none" stroke="#191919" stroke-width="1.5"/>
  <circle cx="230" cy="190" r="5" fill="none" stroke="#191919" stroke-width="1.5"/>
  <circle cx="260" cy="190" r="5" fill="none" stroke="#191919" stroke-width="1.5"/>
  <circle cx="290" cy="190" r="5" fill="none" stroke="#191919" stroke-width="1.5"/>
  <!-- base plate / anchors -->
  <rect x="185" y="370" width="150" height="14" fill="none" stroke="#191919" stroke-width="2"/>
  <line x1="205" y1="384" x2="205" y2="400" stroke="#404040" stroke-width="2"/>
  <line x1="245" y1="384" x2="245" y2="400" stroke="#404040" stroke-width="2"/>
  <line x1="275" y1="384" x2="275" y2="400" stroke="#404040" stroke-width="2"/>
  <line x1="315" y1="384" x2="315" y2="400" stroke="#404040" stroke-width="2"/>
  <!-- dimension / callouts -->
  <line x1="320" y1="40" x2="360" y2="40" stroke="#B4B4B4" stroke-width="1"/>
  <line x1="340" y1="40" x2="340" y2="145" stroke="#B4B4B4" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="350" y="95" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5A5A5A">HSS COLUMN</text>
  <text x="350" y="110" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5A5A5A">8x8x1/2</text>
  <text x="40" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5A5A5A">STEEL BEAM W24x62</text>
  <text x="40" y="128" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5A5A5A">T/BEAM EL. 23'-4"</text>
  <text x="185" y="415" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5A5A5A">ANCHOR BOLTS (4) 3/4" Ø</text>
  <!-- frame -->
  <rect x="1" y="1" width="518" height="418" fill="none" stroke="#B4B4B4" stroke-width="1"/>
</svg>
